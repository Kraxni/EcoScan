<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e6f0df">
<title>Page introuvable · EcoScan</title>
<style>
/* Page autonome : pas de fichier externe, car cette page s'affiche à n'importe quelle adresse du site. */
:root{--bg:#e6f0df;--ink:#0f2a1c;--muted:#456252;--action:#1a7f4b;--action-hover:#136a3d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
main{max-width:34rem;text-align:center}
.brand{margin:0 0 28px;font-weight:700;letter-spacing:-.02em;color:var(--action)}
h1{margin:0 0 12px;text-wrap:balance;font-size:clamp(2rem,6vw,3rem);line-height:1.08;font-weight:700;letter-spacing:-.04em}
p{margin:0 0 28px;color:var(--muted);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:center;align-items:center}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--action);color:#fff;font-weight:650;text-decoration:none;transition:background .22s,transform .12s}
.button:active{transform:scale(.97)}
.link{display:inline-flex;align-items:center;min-height:48px;color:var(--action);font-weight:600;text-decoration:none}
.link:hover,.link:focus-visible{text-decoration:underline}
.button:focus-visible,.link:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media(hover:hover){.button:hover{background:var(--action-hover)}}
@media(prefers-reduced-motion:reduce){.button{transition:none}}
</style>
</head>
<body>
<main>
<p class="brand">EcoScan</p>
<h1>Cette page n’existe pas.</h1>
<p>L’adresse est peut-être incorrecte, ou la page a changé de place. EcoScan est un projet académique : tout se trouve sur la page d’accueil.</p>
<div class="actions">
<a class="button" id="home" href="/">Retour à l’accueil</a>
<a class="link" id="demo" href="/#demo">Essayer la station</a>
</div>
</main>
<script>
/* Sur GitHub Pages, le site vit sous /EcoScan/ ; ailleurs, à la racine. */
(function(){
  var seg=location.pathname.split('/')[1];
  var base=(/\.github\.io$/.test(location.hostname)&&seg)?'/'+seg+'/':'/';
  document.getElementById('home').href=base;
  document.getElementById('demo').href=base+'#demo';
})();
</script>
</body>
</html>
