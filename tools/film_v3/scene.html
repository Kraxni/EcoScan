<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("__FONT__") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#06130d;font-family:"Inter",-apple-system,sans-serif;color:#f3f7f0}
.shot{position:absolute;inset:0;opacity:0;transform-origin:62% 52%}
.shot img.plate{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.shot img.plate.over{opacity:0}
.obj{position:absolute;left:0;top:0;opacity:0;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.ring{position:absolute;border-radius:50%;border:3px solid #6fe0a0;opacity:0;pointer-events:none}
.ring.amber{border-color:#f2b574}
.lab{position:absolute;opacity:0;font-size:27px;font-weight:650;color:#0b2a1b;background:#6fe0a0;padding:9px 20px;border-radius:999px;white-space:nowrap;z-index:6}
.lab.amber{background:#f2b574}
.lab.left::before{left:auto;right:-10px}
.lab::before{content:"";position:absolute;left:-10px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:inherit;border:4px solid #0b2a1b}
.beam{position:absolute;height:4px;background:#6fe0a0;opacity:0;border-radius:2px;box-shadow:0 0 18px 4px rgba(111,224,160,.55)}
.brk{position:absolute;opacity:0;width:150px;height:170px}
#top{position:absolute;left:110px;width:830px;top:34px;display:flex;justify-content:flex-start;gap:26px;font-size:22px;font-weight:600;letter-spacing:.04em;z-index:20}
#top b{color:#6fe0a0;font-weight:700;white-space:nowrap}
#top span{color:rgba(243,247,240,.75);font-weight:500;font-size:19px;align-self:center;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.5)}
#left{position:absolute;left:110px;top:150px;width:830px;height:760px;z-index:10}
.ch{position:absolute;inset:0;opacity:0}
.k{font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6fe0a0;margin-bottom:26px}
.h{font-size:94px;font-weight:720;letter-spacing:-.04em;line-height:.98;color:#fff;margin-bottom:38px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.s{font-size:38px;line-height:1.32;font-weight:450;color:rgba(243,247,240,.9);margin-bottom:14px;opacity:0;max-width:800px;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.chips{position:relative;margin-top:26px;display:flex;flex-wrap:wrap;gap:14px}
.chip{opacity:0;font-size:29px;font-weight:620;padding:12px 24px;border-radius:999px;background:rgba(11,42,27,.78);border:2px solid rgba(111,224,160,.55);color:#d9ffe9;white-space:nowrap}
.chip.no{border-color:rgba(232,146,58,.75);color:#ffd7a8}
.chip.plain{border-color:rgba(243,247,240,.4);color:#f3f7f0}
.route{opacity:0;display:flex;align-items:center;gap:18px;font-size:34px;font-weight:600;margin-bottom:12px;color:#f3f7f0;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.route i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#6fe0a0;flex:none}
.route.amber i{background:#e8923a}.route em{font-style:normal;color:#6fe0a0}.route.amber em{color:#f2b574}
.road{opacity:0;display:flex;gap:16px;align-items:center;font-size:30px;font-weight:620;margin-top:26px}
.road span{padding:12px 24px;border-radius:14px;border:2px solid rgba(243,247,240,.4);background:rgba(11,42,27,.78)}
.road span.on{background:#6fe0a0;color:#0b2a1b;border-color:#6fe0a0}
.road b{color:rgba(243,247,240,.6);font-weight:500}
/* téléphone de démonstration */
#phone{position:absolute;left:1618px;top:420px;width:270px;height:500px;border-radius:44px;background:#f4f8f1;border:10px solid #0a1a12;box-shadow:0 30px 60px rgba(0,0,0,.5);padding:30px 22px;color:#0f2a1c;opacity:0;z-index:8}
#phone .pn{position:absolute;left:50%;top:10px;width:90px;height:10px;margin-left:-45px;border-radius:5px;background:#0a1a12}
#phone .pt{font-size:16px;font-weight:700;letter-spacing:.04em;color:#456252;margin-top:6px}
#phone .ptitle{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:12px 0 14px;min-height:62px}
#phone svg{display:block;margin:0 auto 12px;width:120px;height:120px}
#phone .pstate{font-size:19px;font-weight:600;color:#1a7f4b;text-align:center;min-height:30px}
#phone .ppts{margin-top:12px;text-align:center}
#phone .ppts b{display:block;font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;color:#1a7f4b}
#phone .ppts small{font-size:16px;font-weight:600;color:#456252}
/* progression */
#bar{position:absolute;left:110px;top:962px;width:830px;z-index:20}
#segs{display:flex;gap:8px}
#segs i{flex:1;height:6px;border-radius:3px;background:rgba(243,247,240,.22);position:relative;overflow:hidden}
#segs i b{position:absolute;inset:0;background:#6fe0a0;transform:scaleX(0);transform-origin:left}
#cap{margin-top:14px;font-size:23px;font-weight:600;color:rgba(243,247,240,.78);display:flex;justify-content:space-between;text-shadow:0 1px 10px rgba(0,0,0,.5)}
#end{position:absolute;inset:0;background:#0b2a1b;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;z-index:30}
#end .big{font-size:132px;font-weight:720;letter-spacing:-.045em;line-height:1}
#end .big em{font-style:normal;color:#6fe0a0}
#end .url{font-size:42px;font-weight:600;color:#6fe0a0}
#end .note{font-size:28px;color:rgba(243,247,240,.7);max-width:1100px;line-height:1.4}
</style></head><body>

<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#d6e4d8" stroke-width="9"/><circle id="pring" cx="60" cy="60" r="48" fill="none" stroke="#1a7f4b" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6" transform="rotate(-90 60 60)"/><path id="pcheck" d="M38 61l15 15 29-32" fill="none" stroke="#1a7f4b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>

<script>

const LANG=new URLSearchParams(location.search).get('lang')||'fr';

 chapters:['Une entrée','Session','Dépôt','Séparation','Identification','Aiguillage','Confirmation','Exploitation','Suite'],
 phone:{scan:'Scanner le code',confirm:'Confirmer la session',open:'Session ouverte',scanning:'Lecture du code…',ok:'Prête pour un dépôt vérifié',pts:'points fictifs',paid:'Dépôt validé · +10',demo:'Portefeuille de démonstration',wallet:'Votre portefeuille'},

en:{disc:'Concept film · 3D principle render, no equipment has been built',end:'One gesture.<br><em>A new cycle.</em>',endnote:'Independent academic project. Hardware, recognition and the connected wallet remain to be developed and tested.',

 phone:{scan:'Scan the code',confirm:'Confirm the session',open:'Session open',scanning:'Reading the code…',ok:'Ready for a verified deposit',pts:'demo points',paid:'Deposit verified · +10',demo:'Demonstration wallet',wallet:'Your wallet'},
 labels:{qr:'Station code',slot:'One opening',sep:'Separator',sens:'Sensors',hold:'Isolated check',bins:'Separate compartments',mod:'Accessible modules',tagPet:'Proposed reading · bottle',tagCup:'Doubt · cup'}}};
const CH={
fr:[
 {t:0,e:8,k:'ÉcoNova',h:'Un geste simple.<br>Un nouveau cycle.',s:[[2.4,'Voici ÉcoNova, un concept conçu pour rendre le recyclage plus facile.']]},
 {t:8,e:18,k:'01 · Connexion',h:'Scannez.<br>Connectez-vous.',s:[[8.3,'Scannez le code de la station.'],[10.4,'Une future application confirmerait votre session sur place, avant la validation du dépôt.']]},
 {t:18,e:28,k:'02 · Dépôt',h:'Une seule<br>ouverture.',s:[[18.3,'Bouteilles en plastique, canettes et papiers acceptés partagent la même entrée.'],[22.4,'Les consignes locales guident chaque dépôt.']],chips:[[18.6,'✓ Bouteilles PET'],[19.6,'✓ Canettes'],[20.6,'✓ Papier'],[25.4,'✕ Liquides','no'],[26.3,'✕ Déchets dangereux','no']]},
 {t:28,e:39,k:'03 · Séparation',h:'Un objet<br>à la fois.',s:[[28.3,'Un séparateur présente chaque objet seul aux capteurs.'],[32.1,'Vue dégagée, blocages surveillés.']],chips:[[33.4,'✓ Contrôle des blocages']]},
 {t:39,e:50,k:'04 · Identification',h:'Observer.<br>Puis décider.',s:[[39.3,'Lumière, caméras et capteurs aideraient à identifier la matière.'],[43.7,'En cas de doute, l’objet est isolé pour contrôle.']],chips:[[41.2,'Lecture envisagée'],[44.3,'Confiance faible','no']]},
 {t:50,e:62,k:'05 · Aiguillage',h:'Chaque matière,<br>sa propre voie.',routes:[[50.1,'Bouteilles PET','voie gauche'],[53.1,'Canettes','trappe centrale'],[56.1,'Papier','voie droite'],[59.1,'Objets incertains','contrôle isolé','amber']]},
 {t:62,e:72,k:'06 · Confirmation',h:'Valider avant<br>de créditer.',s:[[62.3,'Seul un dépôt validé ajouterait des EcoPoints à votre application.']],chips:[[65.7,'Un dépôt = un crédit','plain'],[67.7,'Portefeuille de démonstration','plain']]},

 {t:83,e:92,k:'08 · Suite',h:'Simplifier.<br>Puis prouver.',s:[[83.3,'Notre mission : simplifier le recyclage, puis démontrer l’impact.'],[87.1,'Prochaine étape : un prototype et des résultats vérifiables par tous.']],road:[87.6,['Concept (ici)','Prototype','Pilote mesuré']]}],
en:[
 {t:0,e:8,k:'ÉcoNova',h:'A simple gesture.<br>A new cycle.',s:[[2.4,'Meet ÉcoNova, a concept designed to make recycling feel effortless.']]},
 {t:8,e:18,k:'01 · Session',h:'Scan.<br>Connect.',s:[[8.3,'Scan the station’s code to begin.'],[10.4,'A future app would confirm your session on site, ready for a verified deposit.']]},
 {t:18,e:28,k:'02 · Deposit',h:'One single<br>opening.',s:[[18.3,'Plastic bottles, cans and accepted paper share one opening.'],[22.4,'Local collection rules guide every deposit.']],chips:[[18.6,'✓ PET bottles'],[19.6,'✓ Cans'],[20.6,'✓ Paper'],[25.4,'✕ Liquids','no'],[26.3,'✕ Hazardous waste','no']]},
 {t:28,e:39,k:'03 · Separation',h:'One object<br>at a time.',s:[[28.3,'A separator would present each object on its own to the sensors.'],[32.1,'Clear view, jams monitored.']],chips:[[33.4,'✓ Jam check']]},
 {t:39,e:50,k:'04 · Identification',h:'Observe.<br>Then decide.',s:[[39.3,'Light, cameras and sensors would help identify the material.'],[43.7,'When confidence is low, the item is held for review.']],chips:[[41.2,'Proposed reading'],[44.3,'Low confidence','no']]},
 {t:50,e:62,k:'05 · Routing',h:'Each material,<br>its own path.',routes:[[50.1,'Plastic bottles','left path'],[53.1,'Cans','central hatch'],[56.1,'Paper','right path'],[59.1,'Uncertain items','isolated check','amber']]},
 {t:62,e:72,k:'06 · Confirmation',h:'Verify before<br>crediting.',s:[[62.3,'Only a verified deposit would add EcoPoints to your app.']],chips:[[65.7,'One deposit = one credit','plain'],[67.7,'Demonstration wallet','plain']]},
 {t:72,e:83,k:'07 · Operations',h:'Maintain.<br>Measure.',s:[[72.3,'Separate compartments keep materials apart.'],[75.2,'Accessible modules support cleaning and repair.'],[78.2,'A pilot would measure:']],chips:[[79.0,'Sorting accuracy','plain'],[79.8,'Energy','plain'],[80.6,'Cost','plain'],[81.4,'Reliability','plain']]},
 {t:83,e:92,k:'08 · Next',h:'Simplify.<br>Then prove.',s:[[83.3,'Our mission: make recycling simpler, then prove the impact.'],[87.1,'Next comes a prototype, and results everyone can inspect.']],road:[87.6,['Concept (here)','Prototype','Measured pilot']]}]
};
const T=TXT[LANG], chs=CH[LANG], PH=T.phone, LB=T.labels;
const $=s=>document.querySelector(s);
$('#disc').textContent=T.disc;$('#endbig').innerHTML=T.end;$('#endnote').textContent=T.endnote;document.documentElement.lang=LANG;
/* ── colonne de texte ── */
const left=$('#left');
chs.forEach((c,i)=>{
  const d=document.createElement('div');d.className='ch';d.id='c'+i;
  let html=`<div class="k">${c.k}</div><div class="h">${c.h}</div>`;
  (c.s||[]).forEach((s,j)=>html+=`<p class="s" id="s${i}_${j}">${s[1]}</p>`);
  if(c.routes){html+='<div style="margin-top:10px">';c.routes.forEach((r,j)=>html+=`<div class="route ${r[3]||''}" id="r${i}_${j}"><i></i><span>${r[1]} <em>→ ${r[2]}</em></span></div>`);html+='</div>'}
  if(c.chips){html+=`<div class="chips" id="chips${i}">`;c.chips.forEach((p,j)=>html+=`<span class="chip ${p[2]||''}" id="p${i}_${j}">${p[1]}</span>`);html+='</div>'}
  if(c.road){html+=`<div class="road" id="road${i}">`+c.road[1].map((t,j)=>`<span class="${j===0?'on':''}">${t}</span>`).join('<b>→</b>')+'</div>'}
  d.innerHTML=html;left.appendChild(d);
});
const segs=$('#segs');chs.forEach(()=>segs.appendChild(document.createElement('i')).appendChild(document.createElement('b')));
/* ── plans 3D : un conteneur par prise de vue ── */
const shots=$('#shots');
const SHOTS={hero:['hero'],connection:['connection'],connection2:['connection'],entry:['entry'],separator:['separator'],sensor:['sensor'],routing:['routing-neutral','routing-pet','routing-alu','routing-paper','routing-hold'],service:['service'],final:['final']};
const key=n=>n.replace(/2$/,'');
const el={};
Object.entries(SHOTS).forEach(([id,plates])=>{
  const s=document.createElement('div');s.className='shot';s.id='sh_'+id;
  plates.forEach((p,i)=>{const im=document.createElement('img');im.className='plate'+(i?' over':'');im.id='pl_'+p;im.src=DIR+'/plates/'+p+'.webp';s.appendChild(im)});
  shots.appendChild(s);el[id]=s;
});
const pt=(shot,name)=>{const k=P[shot.startsWith('routing')?'routing-neutral':key(shot)]||P.hero;return k.points[name]};
const ppm=shot=>{const a=pt(shot,'pet'),b=pt(shot,'paper');return Math.hypot(a[0]-b[0],a[1]-b[1])/0.8};   // pixels par mètre
/* objets 3D (sprites) */
const SPR=['bottle','can','paper','cup'];
function obj(shot,kind,id){const im=document.createElement('img');im.className='obj';im.id=id;im.src=DIR+'/sprites/'+kind+'.png';el[shot].appendChild(im);const k=1.35*ppm(shot)/1280;im.style.width=(512*k)+'px';im.style.height=(512*k)+'px';im.dataset.k=k;return im}
const mk=(shot,kind)=>obj(shot,kind,`o_${shot}_${kind}`);
function ring(shot,name,id,size,amber){const r=document.createElement('div');r.className='ring'+(amber?' amber':'');r.id=id;const p=pt(shot,name),w=size*ppm(shot);r.style.cssText=`left:${p[0]-w/2}px;top:${p[1]-w/2}px;width:${w}px;height:${w}px`;el[shot].appendChild(r);return r}
function label(shot,name,id,text,dx,dy,amber,left){const l=document.createElement('div');l.className='lab'+(amber?' amber':'')+(left?' left':'');l.dataset.dx=left?10:-10;if(left)gsap.set(l,{xPercent:-100});l.id=id;l.textContent=text;const p=pt(shot,name);l.style.left=(p[0]+dx)+'px';l.style.top=(p[1]+dy)+'px';el[shot].appendChild(l);return l}
const brk=(shot,id)=>{const b=document.createElementNS?document.createElement('div'):null;b.className='brk';b.id=id;b.innerHTML='<svg viewBox="0 0 150 170" width="150" height="170" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M6 40V6h34M110 6h34v34M6 130v34h34M110 164h34v-34"/></svg>';b.style.color='#6fe0a0';el[shot].appendChild(b);return b};
const at=(o,shot,name,dx=0,dy=0,k=null)=>{const p=pt(shot,name);return {x:p[0]+dx,y:p[1]+dy}};
/* ── chronologie ── */
const tl=gsap.timeline({paused:true});
const fo=(sel,t,d=0.45)=>tl.to(sel,{opacity:0,duration:d,ease:'power1.in'},t);
const fi=(sel,t,y=22,d=0.7)=>tl.fromTo(sel,{opacity:0,y},{opacity:1,y:0,duration:d,ease:'power3.out'},t);
chs.forEach((c,i)=>{
  const id='#c'+i;
  tl.set(id,{opacity:1},c.t).fromTo(id+' .k',{opacity:0,y:18},{opacity:1,y:0,duration:.6,ease:'power3.out'},c.t+.05).fromTo(id+' .h',{opacity:0,y:40},{opacity:1,y:0,duration:.9,ease:'expo.out'},c.t+.15);
  (c.s||[]).forEach((s,j)=>fi('#s'+i+'_'+j,s[0],18,.7));
  (c.chips||[]).forEach((p,j)=>tl.fromTo('#p'+i+'_'+j,{opacity:0,y:16,scale:.92},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(1.6)'},p[0]));
  (c.routes||[]).forEach((r,j)=>fi('#r'+i+'_'+j,r[0],16,.6));
  if(c.road)tl.fromTo('#road'+i,{opacity:0,y:16},{opacity:1,y:0,duration:.6},c.road[0]);
  if(i<chs.length-1)tl.to(id,{opacity:0,duration:.45,ease:'power1.in'},c.e-.45); else tl.set(id,{opacity:1},c.e);
  const b=segs.children[i].firstChild;
  tl.fromTo(b,{scaleX:0},{scaleX:1,duration:c.e-c.t,ease:'none'},c.t);
  tl.call(()=>{$('#capt').textContent=T.chapters[i];$('#capn').textContent=(i+1)+' / '+chs.length},null,c.t+.01);
});
/* prises de vue : fondus enchaînés et lent travelling avant */
const VIEW=[['hero',0,8.4],['connection',7.8,18.4],['entry',17.8,28.4],['separator',27.8,39.4],['sensor',38.8,50.4],['routing',49.8,62.4],['connection2',61.8,72.4],['service',71.8,83.4],['final',82.8,92]];
const ORIGIN={hero:'55% 55%',connection:'60% 60%',connection2:'60% 60%',entry:'62% 45%',separator:'62% 45%',sensor:'60% 45%',routing:'62% 55%',service:'58% 52%',final:'56% 55%'};
tl.set('.shot',{opacity:0},0);
VIEW.forEach(([id,a,b],i)=>{
  tl.set('#sh_'+id,{transformOrigin:ORIGIN[id]},0);
  tl.fromTo('#sh_'+id,{opacity:0},{opacity:1,duration:.6,ease:'power1.inOut'},a);
  if(i<VIEW.length-1)tl.to('#sh_'+id,{opacity:0,duration:.6,ease:'power1.inOut'},b-.6);
  tl.fromTo('#sh_'+id,{scale:1.0},{scale:1.055,duration:b-a,ease:'none'},a);

/* ── 0 · introduction : le plan d'ensemble respire ── */
/* ── 1 · connexion : QR, téléphone, session ── */
const qrR=ring('connection','qr','r_qr',.16);const qrL=label('connection','qr','l_qr',LB.qr,-95,-26,false,true);
const qrR2=ring('connection2','qr','r_qr2',.16);
tl.set('#phone',{opacity:0},0);
tl.fromTo('#phone',{opacity:0,y:60},{opacity:1,y:0,duration:.8,ease:'expo.out'},8.2).to('#phone',{opacity:0,y:30,duration:.5},17.4);
tl.set('#ptitle',{textContent:PH.scan},0).set('#pstate',{textContent:PH.scanning},0).set('#ppsm',{textContent:PH.pts},0);
tl.set('#ptitle',{textContent:PH.confirm},10.4).set('#pstate',{textContent:PH.open},10.6).set('#pstate',{textContent:PH.ok},13.2);
tl.fromTo('#pring',{attr:{'stroke-dashoffset':301.6}},{attr:{'stroke-dashoffset':0},duration:2.0,ease:'power1.inOut'},8.5);
tl.fromTo('#pcheck',{opacity:0},{opacity:1,duration:.3},10.6);
tl.fromTo(qrR,{opacity:0,scale:.5},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'},8.4).fromTo(qrR,{scale:1},{scale:1.5,opacity:0,duration:.9,ease:'power1.out',repeat:1},9.2).to(qrR,{opacity:0,duration:.1},13);
tl.fromTo(qrL,{opacity:0,x:+qrL.dataset.dx},{opacity:1,x:0,duration:.45},8.4).to(qrL,{opacity:0,duration:.35},12.6);
/* ── 2 · dépôt : trois objets dans une seule ouverture ── */
ring('entry','entry','r_slot',.2);const slotL=label('entry','entry','l_slot',LB.slot,-150,-30,false,true);
