<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("__FONT__") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b2a1b;font-family:"Inter",-apple-system,sans-serif;color:#f3f7f0}

.ch{position:absolute;inset:0;opacity:0}
.k{font-size:26px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6fe0a0;margin-bottom:26px}
.h{font-size:94px;font-weight:720;letter-spacing:-.04em;line-height:.98;color:#fff;margin-bottom:38px}
.s{font-size:38px;line-height:1.32;font-weight:450;color:rgba(243,247,240,.84);margin-bottom:14px;opacity:0;max-width:800px}
.chips{position:relative;margin-top:26px;display:flex;flex-wrap:wrap;gap:14px}

.route{opacity:0;display:flex;align-items:center;gap:18px;font-size:34px;font-weight:600;margin-bottom:12px;color:#f3f7f0}
.route i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#6fe0a0;flex:none}
.route.amber i{background:#e8923a}.route em{font-style:normal;color:#6fe0a0}.route.amber em{color:#f2b574}
.road{opacity:0;display:flex;gap:16px;align-items:center;font-size:30px;font-weight:620;margin-top:26px}
.road span{padding:12px 24px;border-radius:14px;border:2px solid rgba(243,247,240,.3)}
.road span.on{background:#6fe0a0;color:#0b2a1b;border-color:#6fe0a0}
.road b{color:rgba(243,247,240,.5);font-weight:500}
/* panneau de scène */
#panel{position:absolute;left:960px;top:84px;width:850px;height:940px;border-radius:40px;background:#0f3a27;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:0 0}
#svgwrap{position:absolute;left:24px;top:10px;width:600px;height:920px}
#svgwrap svg{width:100%;height:100%;display:block;overflow:visible}
.lab{position:absolute;opacity:0;font-size:23px;font-weight:650;color:#0b2a1b;background:#6fe0a0;padding:8px 18px;border-radius:999px;white-space:nowrap;z-index:5}
.lab.amber{background:#f2b574}
.lab::before{content:"";position:absolute;left:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:inherit;border:4px solid #0f3a27}
.sg-label{font-family:Inter;font-size:10px;font-weight:600;letter-spacing:.08em}
.sg-tagtext{font-family:Inter;font-size:17px;font-weight:600}
.sg-points{font-family:Inter;font-size:44px;font-weight:700}
.sg-toast{font-family:Inter;font-size:12px;font-weight:700}
/* progression */
#bar{position:absolute;left:110px;top:962px;width:830px}
#segs{display:flex;gap:8px}
#segs i{flex:1;height:6px;border-radius:3px;background:rgba(243,247,240,.18);position:relative;overflow:hidden}
#segs i b{position:absolute;inset:0;background:#6fe0a0;transform:scaleX(0);transform-origin:left}
#cap{margin-top:14px;font-size:23px;font-weight:600;color:rgba(243,247,240,.7);display:flex;justify-content:space-between}
/* carte de fin */
#end{position:absolute;inset:0;background:#0b2a1b;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
#end .big{font-size:132px;font-weight:720;letter-spacing:-.045em;line-height:1}
#end .big em{font-style:normal;color:#6fe0a0}
#end .url{font-size:42px;font-weight:600;color:#6fe0a0}
#end .note{font-size:28px;color:rgba(243,247,240,.62);max-width:1100px;line-height:1.4}
</style></head><body>
<img id="leaves" src="__LEAVES__" alt="">
<div id="top"><b>EcoScan · ÉcoNova</b><span id="disc"></span></div>
<div id="left"></div>
<div id="panel"><div id="cam"><div id="svgwrap">__SVG__</div><div id="labs"></div></div></div>
<div id="bar"><div id="segs"></div><div id="cap"><span id="capt"></span><span id="capn"></span></div></div>
<div id="end"><div class="big" id="endbig"></div><div class="url">trueballknower.github.io/EcoScan</div><div class="note" id="endnote"></div></div>
<script src="__GSAP__"></script>
<script>
const LANG=new URLSearchParams(location.search).get('lang')||'fr';
const TXT={

 chapters:['Une entrée','Session','Dépôt','Séparation','Identification','Aiguillage','Confirmation','Exploitation','Suite']},
en:{disc:'Concept film · illustration, no equipment has been built',end:'One gesture.<br><em>A new cycle.</em>',endnote:'Independent academic project. Hardware, recognition and the connected wallet remain to be developed and tested.',
 chapters:['One opening','Session','Deposit','Separation','Identification','Routing','Confirmation','Operations','Next']}};
const CH={
fr:[
 {t:0,e:8,k:'ÉcoNova',h:'Un geste simple.<br>Un nouveau cycle.',s:[[2.4,'Voici ÉcoNova, un concept conçu pour rendre le recyclage plus facile.']]},
 {t:8,e:18,k:'01 · Connexion',h:'Scannez.<br>Connectez-vous.',s:[[8.3,'Scannez le code de la station.'],[10.4,'Une future application confirmerait votre session sur place, avant la validation du dépôt.']]},
 {t:18,e:28,k:'02 · Dépôt',h:'Une seule<br>ouverture.',s:[[18.3,'Bouteilles en plastique, canettes et papiers acceptés partagent la même entrée.'],[22.4,'Les consignes locales guident chaque dépôt.']],chips:[[18.6,'✓ Bouteilles PET'],[19.6,'✓ Canettes'],[20.6,'✓ Papier'],[25.4,'✕ Liquides','no'],[26.3,'✕ Déchets dangereux','no']]},
 {t:28,e:39,k:'03 · Séparation',h:'Un objet<br>à la fois.',s:[[28.3,'Un séparateur présente chaque objet seul aux capteurs.'],[32.1,'Vue dégagée, blocages surveillés.']],chips:[[33.4,'✓ Contrôle des blocages']]},
 {t:39,e:50,k:'04 · Identification',h:'Observer.<br>Puis décider.',s:[[39.3,'Lumière, caméras et capteurs aideraient à identifier la matière.'],[43.7,'En cas de doute, l’objet est isolé pour contrôle.']],chips:[[41.2,'Lecture envisagée'],[44.3,'Confiance faible','no']]},
 {t:50,e:62,k:'05 · Aiguillage',h:'Chaque matière,<br>sa propre voie.',routes:[[50.1,'Bouteilles PET','voie gauche'],[53.1,'Canettes','trappe centrale'],[56.1,'Papier','voie droite'],[59.1,'Objets incertains','contrôle isolé','amber']]},

 {t:83,e:92,k:'08 · Suite',h:'Simplifier.<br>Puis prouver.',s:[[83.3,'Notre mission : simplifier le recyclage, puis démontrer l’impact.'],[87.1,'Prochaine étape : un prototype et des résultats vérifiables par tous.']],road:[87.6,['Concept (ici)','Prototype','Pilote mesuré']]}],
en:[
 {t:0,e:8,k:'ÉcoNova',h:'A simple gesture.<br>A new cycle.',s:[[2.4,'Meet ÉcoNova, a concept designed to make recycling feel effortless.']]},
 {t:8,e:18,k:'01 · Session',h:'Scan.<br>Connect.',s:[[8.3,'Scan the station’s code to begin.'],[10.4,'A future app would confirm your session on site, ready for a verified deposit.']]},
 {t:18,e:28,k:'02 · Deposit',h:'One single<br>opening.',s:[[18.3,'Plastic bottles, cans and accepted paper share one opening.'],[22.4,'Local collection rules guide every deposit.']],chips:[[18.6,'✓ PET bottles'],[19.6,'✓ Cans'],[20.6,'✓ Paper'],[25.4,'✕ Liquids','no'],[26.3,'✕ Hazardous waste','no']]},
 {t:28,e:39,k:'03 · Separation',h:'One object<br>at a time.',s:[[28.3,'A separator would present each object on its own to the sensors.'],[32.1,'Clear view, jams monitored.']],chips:[[33.4,'✓ Jam check']]},
 {t:39,e:50,k:'04 · Identification',h:'Observe.<br>Then decide.',s:[[39.3,'Light, cameras and sensors would help identify the material.'],[43.7,'When confidence is low, the item is held for review.']],chips:[[41.2,'Proposed reading'],[44.3,'Low confidence','no']]},
 {t:50,e:62,k:'05 · Routing',h:'Each material,<br>its own path.',routes:[[50.1,'Plastic bottles','left path'],[53.1,'Cans','central hatch'],[56.1,'Paper','right path'],[59.1,'Uncertain items','isolated check','amber']]},
 {t:62,e:72,k:'06 · Confirmation',h:'Verify before<br>crediting.',s:[[62.3,'Only a verified deposit would add EcoPoints to your app.']],chips:[[65.7,'One deposit = one credit','plain'],[67.7,'Demonstration wallet','plain']]},
 {t:72,e:83,k:'07 · Operations',h:'Maintain.<br>Measure.',s:[[72.3,'Separate compartments keep materials apart.'],[75.2,'Accessible modules support cleaning and repair.'],[78.2,'A pilot would measure:']],chips:[[79.0,'Sorting accuracy','plain'],[79.8,'Energy','plain'],[80.6,'Cost','plain'],[81.4,'Reliability','plain']]},
 {t:83,e:92,k:'08 · Next',h:'Simplify.<br>Then prove.',s:[[83.3,'Our mission: make recycling simpler, then prove the impact.'],[87.1,'Next comes a prototype, and results everyone can inspect.']],road:[87.6,['Concept (here)','Prototype','Measured pilot']]}]
};
const T=TXT[LANG], chs=CH[LANG];
document.getElementById('disc').textContent=T.disc;
document.getElementById('endbig').innerHTML=T.end;document.getElementById('endnote').textContent=T.endnote;
document.documentElement.lang=LANG;
/* ── colonne de texte ── */
const left=document.getElementById('left');
chs.forEach((c,i)=>{

  if(c.chips){html+=`<div class="chips" id="chips${i}">`;c.chips.forEach((p,j)=>html+=`<span class="chip ${p[2]||''}" id="p${i}_${j}">${p[1]}</span>`);html+='</div>'}

});
/* ── barre de progression ── */
const segs=document.getElementById('segs');chs.forEach(()=>segs.appendChild(document.createElement('i')).appendChild(document.createElement('b')));
const capt=document.getElementById('capt'),capn=document.getElementById('capn');

const src=svg.querySelector('#sg-obj');
const kinds=['pet','can','paper','cup'];
kinds.forEach(k=>{const g=document.createElementNS(NS,'g');g.id='vo-'+k;g.setAttribute('opacity','0');const piece=src.querySelector(`[data-kind=${k}]`).cloneNode(true);piece.style.display='';g.appendChild(piece);svg.appendChild(g);});
src.style.display='none';
const brackets=document.createElementNS(NS,'g');brackets.id='vb';brackets.setAttribute('opacity','0');brackets.setAttribute('fill','none');brackets.setAttribute('stroke','#6fe0a0');brackets.setAttribute('stroke-width','2.5');brackets.setAttribute('stroke-linecap','round');
brackets.innerHTML='<path d="M-30 -22v-12h12M30 -22v-12h-12M-30 38v12h12M30 38v12h-12"/>';svg.appendChild(brackets);
document.getElementById('sg-tag').style.display='block';
const $=s=>document.querySelector(s);
svg.setAttribute('viewBox','0 24 500 770');
if(LANG==='en'){
  const M={'ENTRÉE UNIQUE':'SINGLE OPENING','LECTURE · ÉCLAIRAGE':'READING · LIGHTING','CONTRÔLE ISOLÉ':'ISOLATED CHECK','Un humain tranche':'A human decides','PORTE · QR DE SESSION':'DOOR · SESSION QR','POINTS FICTIFS':'DEMO POINTS','APP ECOSCAN · DÉMO':'ECOSCAN APP · DEMO','PAPIER':'PAPER','LECTURE ENVISAGÉE':'PROPOSED READING'};
  svg.querySelectorAll('text').forEach(t=>{const k=t.textContent.trim();if(M[k])t.textContent=M[k];});
}
const SC=1.2,OX=24,OY=10;
function label(id,text,sx,sy,amber){const l=document.createElement('div');l.className='lab'+(amber?' amber':'');l.id=id;l.textContent=text;l.style.left=(OX+sx*SC+22)+'px';l.style.top=(OY+(sy-24)*SC-22)+'px';document.getElementById('labs').appendChild(l);return l}
const L={
 qr:label('l_qr',LANG==='fr'?'Code de la station':'Station code',444,586),
 slot:label('l_slot',LANG==='fr'?'Une seule ouverture':'One opening',446,112),
 sep:label('l_sep',LANG==='fr'?'Séparateur':'Separator',380,292),
 sens:label('l_sens',LANG==='fr'?'Capteurs':'Sensors',440,200),
 ctl:label('l_ctl',LANG==='fr'?'Contrôle isolé':'Isolated check',22,282,true),
 bins:label('l_bins',LANG==='fr'?'Compartiments séparés':'Separate compartments',444,512),
 mod:label('l_mod',LANG==='fr'?'Modules accessibles':'Accessible modules',444,452)
};
/* ── chronologie principale ── */
const tl=gsap.timeline({paused:true});
const fo=(sel,t,d=0.45)=>tl.to(sel,{opacity:0,duration:d,ease:'power1.in'},t);
const fi=(sel,t,y=22,d=0.7)=>tl.fromTo(sel,{opacity:0,y},{opacity:1,y:0,duration:d,ease:'power3.out'},t);
const O=k=>'#vo-'+k;
function drop(k,t,from=[320,-30],to=[320,190],d=1.2,ease='power2.inOut'){
  tl.fromTo(O(k),{opacity:0,x:from[0],y:from[1],scale:1.05,rotation:0},{opacity:1,x:to[0],y:to[1],scale:.9,duration:d,ease},t);
}
const hide=(k,t,d=.3)=>tl.to(O(k),{opacity:0,duration:d},t);
/* chapitres : texte */
chs.forEach((c,i)=>{
  const id='#c'+i;
  tl.set(id,{opacity:1},c.t).fromTo(id+' .k',{opacity:0,y:18},{opacity:1,y:0,duration:.6,ease:'power3.out'},c.t+.05).fromTo(id+' .h',{opacity:0,y:40},{opacity:1,y:0,duration:.9,ease:'expo.out'},c.t+.15);
  (c.s||[]).forEach((s,j)=>fi('#s'+i+'_'+j,s[0],18,.7));
  (c.chips||[]).forEach((p,j)=>tl.fromTo('#p'+i+'_'+j,{opacity:0,y:16,scale:.92},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(1.6)'},p[0]));
  (c.routes||[]).forEach((r,j)=>fi('#r'+i+'_'+j,r[0],16,.6));
  if(c.road)tl.fromTo('#road'+i,{opacity:0,y:16},{opacity:1,y:0,duration:.6},c.road[0]);
  if(i<chs.length-1)tl.to(id,{opacity:0,duration:.45,ease:'power1.in'},c.e-.45); else tl.set(id,{opacity:1},c.e);
});
/* barre */
chs.forEach((c,i)=>{
  const b=segs.children[i].firstChild;
  tl.fromTo(b,{scaleX:0},{scaleX:1,duration:c.e-c.t,ease:'none'},c.t);
  tl.call(()=>{capt.textContent=T.chapters[i];capn.textContent=(i+1)+' / '+chs.length},null,c.t+.01);
});
/* scène : entrée */
tl.fromTo('#panel',{opacity:0,x:80},{opacity:1,x:0,duration:1.4,ease:'expo.out'},.2);
tl.set('#l_qr,#l_slot,#l_sep,#l_sens,#l_ctl,#l_bins,#l_mod',{opacity:0},0);
const lab=(id,a,b)=>{tl.fromTo(id,{opacity:0,scale:.8},{opacity:1,scale:1,duration:.4,ease:'back.out(2)'},a);tl.to(id,{opacity:0,duration:.35},b)};
/* initiales */
tl.set('#sg-link',{strokeDasharray:'1 1',strokeDashoffset:1},0).set('#sg-ping',{opacity:0},0).set('#sg-beam,#sg-tag,#sg-toast',{opacity:0},0).set('#sg-session-dot',{attr:{fill:'#4a5c53'}},0);
/* 1 — connexion */
lab('#l_qr',8.4,13);
tl.fromTo('#sg-link',{strokeDashoffset:1},{strokeDashoffset:0,duration:1.9,ease:'power1.inOut'},8.4);
tl.fromTo('#sg-ping',{opacity:1,scale:.6},{opacity:0,scale:3.2,duration:.8,ease:'power1.out'},10.4);
tl.to('#sg-session-dot',{attr:{fill:'#6fe0a0'},duration:.2},10.6);
tl.fromTo('#sg-phone',{scale:1},{scale:1.07,duration:.25,yoyo:true,repeat:1},10.6);
tl.fromTo('#sg-toast',{opacity:0},{opacity:1,duration:.3},11.2).set('#sg-toast-text',{textContent:LANG==='fr'?'Session ouverte':'Session open'},11.2).to('#sg-toast',{opacity:0,duration:.3},14.6);
tl.fromTo('#sg-phone',{scale:1},{scale:1.07,duration:.25,yoyo:true,repeat:1},13.2);

lab('#l_slot',18.4,22.5);
drop('pet',18.6,[320,-30],[320,120],1.0);hide('pet',19.7);
drop('can',19.7,[320,-30],[320,120],1.0);hide('can',20.8);
drop('paper',20.8,[320,-30],[320,120],1.0);hide('paper',21.9);
/* 3 — séparation : un à la fois */
lab('#l_sep',28.4,32);lab('#l_sens',32.2,38);
drop('pet',28.4,[320,70],[320,190],1.1);hide('pet',30.8,.4);
drop('can',31.4,[320,70],[320,190],1.1);hide('can',33.8,.4);
drop('paper',34.6,[320,70],[320,190],1.1);hide('paper',37.3,.4);
/* 4 — identification */
tl.fromTo('#sg-beam',{opacity:0,attr:{y:138}},{opacity:1,attr:{y:222},duration:.7,ease:'sine.inOut'},39.6)
  .to('#sg-beam',{attr:{y:138},duration:.7,ease:'sine.inOut'},40.3).to('#sg-beam',{attr:{y:222},duration:.7,ease:'sine.inOut'},41.0).to('#sg-beam',{attr:{y:138},duration:.7,ease:'sine.inOut'},41.7).to('#sg-beam',{opacity:0,duration:.2},42.4);
drop('pet',39.0,[320,70],[320,190],.9);
tl.fromTo('#vb',{opacity:0,x:320,y:190},{opacity:1,duration:.3},39.7).to('#vb',{opacity:0,duration:.3},43.5);
tl.set('#sg-tag-text',{textContent:LANG==='fr'?'Bouteille plastique':'Plastic bottle'},41.0).fromTo('#sg-tag',{opacity:0},{opacity:1,duration:.4},41.0).to('#sg-tag',{opacity:0,duration:.3},43.4);
hide('pet',43.5,.3);
drop('cup',43.7,[320,70],[320,190],.8);
tl.set('#vb',{x:320,y:190},43.6).to('#vb',{opacity:1,attr:{stroke:'#e8923a'},duration:.3},44.0).to('#vb',{opacity:0,duration:.3},45.6);
tl.set('#sg-tag-text',{textContent:LANG==='fr'?'Gobelet · doute':'Cup · uncertain'},44.2).fromTo('#sg-tag',{opacity:0},{opacity:1,duration:.4},44.2).to('#sg-tag',{opacity:0,duration:.3},45.6);
tl.fromTo('#sg-gate',{opacity:1},{opacity:0,duration:.2},45.5).to(O('cup'),{x:82,y:206,scale:.8,duration:1.8,ease:'power3.inOut'},45.8).to('#sg-gate',{opacity:1,duration:.2},48.2);
lab('#l_ctl',46.6,49.6);
tl.set('#vb',{attr:{stroke:'#6fe0a0'}},0);
/* 5 — aiguillage */
tl.to(O('cup'),{opacity:0,duration:.3},49.6);
const bin=(k,t)=>tl.to('#sg-fill-'+k,{attr:{y:522,height:38},opacity:.9,duration:.5},t);
tl.set('#sg-fill-pet,#sg-fill-can,#sg-fill-paper',{attr:{y:552,height:8},opacity:.25},0);
function route(k,t,angle,x,ybin=508){
  tl.fromTo(O(k),{opacity:0,x:320,y:70,scale:1,rotation:0},{opacity:1,y:190,duration:.7,ease:'power2.inOut'},t-.1);
  tl.to('#sg-diverter',{rotation:angle,duration:.35},t+.7);
  tl.to(O(k),{y:280,x:angle===90?320:320+(angle<0?-6:6),duration:.35,ease:'power2.in'},t+.9);
  tl.to(O(k),{x:x,y:angle===90?400:420,rotation:angle===90?0:(angle<0?-28:28),duration:.4,ease:'power1.in'},t+1.25);

route('pet',50.1,-30,238);route('can',53.1,90,320);route('paper',56.1,30,402);
tl.fromTo(O('cup'),{opacity:0,x:320,y:70,scale:1,rotation:0},{opacity:1,y:190,duration:.7},59.0).to('#sg-gate',{opacity:0,duration:.2},59.8).to(O('cup'),{x:82,y:206,scale:.8,duration:1.2,ease:'power3.inOut'},60.0).to('#sg-gate',{opacity:1,duration:.2},61.4);
lab('#l_ctl',60.2,62);
